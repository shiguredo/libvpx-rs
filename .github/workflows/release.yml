name: Release

on:
  push:
    tags:
      - "*"

env:
  RUST_BACKTRACE: 1

jobs:
  github-release:
    name: "Create GitHub Release"
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ${{ contains(steps.get_version.outputs.VERSION, 'canary') }}; then
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --prerelease \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          else
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          fi

  build-prebuilt:
    name: "Build prebuilt (${{ matrix.target }})"
    needs: github-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ubuntu-26.04_x86_64
            os: ubuntu-26.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-26.04_arm64
            os: ubuntu-26.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: ubuntu-24.04_x86_64
            os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-24.04_arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: ubuntu-22.04_x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - target: ubuntu-22.04_arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - target: macos_arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm

      - name: Build with source-build
        run: cargo build --release --features source-build

      - name: Find OUT_DIR
        id: find_out_dir
        run: |
          OUT_DIR=$(find target/release/build/shiguredo_libvpx-*/out -maxdepth 0 -type d 2>/dev/null | head -1)
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_OUTPUT

      - name: Create prebuilt archive
        run: |
          mkdir -p staging/lib
          cp ${{ steps.find_out_dir.outputs.OUT_DIR }}/build/libvpx/lib/libvpx.a staging/lib/
          cp ${{ steps.find_out_dir.outputs.OUT_DIR }}/bindings.rs staging/
          tar czf libvpx-${{ matrix.target }}.tar.gz -C staging .

      - name: Generate SHA256 checksum
        run: |
          if command -v sha256sum &> /dev/null; then
            sha256sum libvpx-${{ matrix.target }}.tar.gz > libvpx-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 libvpx-${{ matrix.target }}.tar.gz > libvpx-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} \
            libvpx-${{ matrix.target }}.tar.gz \
            libvpx-${{ matrix.target }}.tar.gz.sha256 \
            --clobber

  build-prebuilt-windows:
    name: "Build prebuilt (windows_x86_64)"
    needs: github-release
    permissions:
      contents: write
    runs-on: windows-2025-vs2026
    # MSVC 向けソリューションは Debug / Release の 2 構成をビルドするため、
    # MinGW (単一構成) だった頃より時間がかかる
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # コンパイラには MSVC (cl.exe / msbuild.exe) を使う。
      # MSYS2 は configure / GNU make / nasm が動く POSIX シェルとして用意する。
      # 以降の shell: msys2 {0} は setup-msys2 のカスタムシェルで、{0} は run: の
      # 内容を書き出した一時スクリプトのパスに置換される
      - name: Setup MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            git
            make
            nasm
            mingw-w64-x86_64-clang

      # ツールチェーンは rust-toolchain.toml で MSRV に固定している。
      # ホストのターゲット (x86_64-pc-windows-msvc) でビルドする
      - name: Build with source-build
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: /mingw64/bin
        run: cargo build --release --features source-build

      - name: Find OUT_DIR and create prebuilt archive
        shell: msys2 {0}
        run: |
          OUT_DIR=$(find target/release/build/shiguredo_libvpx-*/out -maxdepth 0 -type d -print -quit)
          mkdir -p staging/lib
          cp "${OUT_DIR}/build/libvpx/lib/vpx.lib" staging/lib/
          cp "${OUT_DIR}/bindings.rs" staging/
          # シンボル書き換えが効いていないライブラリを配布しないよう、アーカイブ作成前に検証する。
          # Windows の llvm-nm.exe は出力に \r が混じるため、行末アンカーの検査の前に除去する
          sysroot=$(cygpath -u "$(rustc --print sysroot)")
          host_triple=$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')
          "$sysroot/lib/rustlib/$host_triple/bin/llvm-nm.exe" \
            --defined-only --extern-only --format=just-symbols staging/lib/vpx.lib \
            | tr -d '\r' > target/defined-symbols.txt
          defined_symbols=$(grep -E '^[a-zA-Z_][a-zA-Z0-9_]*$' target/defined-symbols.txt || true)
          if [ -z "$defined_symbols" ]; then
            echo "::error::defined symbols not found in the static library"
            exit 1
          fi
          if echo "$defined_symbols" | grep -v '^shiguredo_vpx_'; then
            echo "::error::symbols without shiguredo_vpx_ prefix found"
            exit 1
          fi
          tar czf libvpx-windows_x86_64.tar.gz -C staging .

      - name: Generate SHA256 checksum
        shell: msys2 {0}
        run: sha256sum libvpx-windows_x86_64.tar.gz > libvpx-windows_x86_64.tar.gz.sha256

      - name: Upload prebuilt archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.github-release.outputs.version }} `
            libvpx-windows_x86_64.tar.gz `
            libvpx-windows_x86_64.tar.gz.sha256 `
            --clobber

      # アップロード済みの prebuilt を build.rs が自動選択し、リンクとテストが通ることも確認する
      - name: Verify released prebuilt
        shell: msys2 {0}
        run: cargo test --release --locked

  build-mobile-prebuilt:
    name: Build mobile prebuilt
    needs: github-release
    permissions:
      contents: write
    uses: ./.github/workflows/mobile.yml
    with:
      release-version: ${{ needs.github-release.outputs.version }}

  publish:
    needs: [github-release, build-prebuilt, build-prebuilt-windows, build-mobile-prebuilt]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [github-release, build-prebuilt, build-prebuilt-windows, build-mobile-prebuilt, publish]
    timeout-minutes: 20
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
