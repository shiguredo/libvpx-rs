name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "develop"
      - "feature/**"
    tags-ignore:
      - "**"
    paths-ignore:
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  fmt-clippy:
    name: fmt-clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: sudo apt-get update && sudo apt-get install -y build-essential nasm
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ubuntu-24.04
          toolchain: "1.93"
      # ツールチェーンは rust-toolchain.toml で MSRV に固定しているため、
      # 最初の cargo 実行時に MSRV のツールチェーンが導入される
      - run: cargo fmt --all --check
      - run: cargo clippy --features source-build -- -D warnings

  test:
    name: ${{ matrix.os }}
    needs: fmt-clippy
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
          - os: ubuntu-26.04-arm
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
          - os: macos-26
          - os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install build dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y build-essential nasm
      - uses: shiguredo/github-actions/.github/actions/rust-cache@main
        with:
          os: ${{ matrix.os }}
          toolchain: "1.93"
      # ツールチェーンは rust-toolchain.toml で MSRV に固定している
      - run: cargo test --features source-build

  test-windows:
    name: windows-2025-vs2026
    needs: fmt-clippy
    runs-on: windows-2025-vs2026
    # MSVC 向けソリューションは Debug / Release の 2 構成をビルドするため、
    # MinGW (単一構成) だった頃より時間がかかる
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # コンパイラには MSVC (cl.exe / msbuild.exe) を使う。
      # MSYS2 は configure / GNU make / nasm が動く POSIX シェルとして用意する。
      # 以降の shell: msys2 {0} は setup-msys2 のカスタムシェルで、{0} は run: の
      # 内容を書き出した一時スクリプトのパスに置換される
      - name: Setup MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2.31.1
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            git
            make
            nasm
            mingw-w64-x86_64-clang
      # ツールチェーンは rust-toolchain.toml で MSRV に固定している。
      # ホストのターゲット (x86_64-pc-windows-msvc) でビルドとテストを行う
      - name: Test with source-build
        shell: msys2 {0}
        env:
          LIBCLANG_PATH: /mingw64/bin
        run: cargo test --features source-build
      # 生成した静的ライブラリのシンボル書き換えと、MSVC の CRT を参照していることを
      # 検証する。MinGW の CRT シンボルが混ざっていると、MSVC でビルドした他の
      # ネイティブライブラリと同一バイナリにリンクできない
      - name: Verify symbols
        shell: msys2 {0}
        run: |
          lib_path=$(find target/debug/build -path '*/out/build/libvpx/lib/vpx.lib' -print -quit)
          if [ -z "$lib_path" ]; then
            echo "::error::MSVC static library not found"
            exit 1
          fi
          sysroot=$(cygpath -u "$(rustc --print sysroot)")
          host_triple=$(rustc -vV | tr -d '\r' | sed -n 's/^host: //p')
          llvm_nm="$sysroot/lib/rustlib/$host_triple/bin/llvm-nm.exe"
          # 定義済み外部シンボルはすべて書き換え後のプレフィックスが付いていること。
          # 書き換えが効いていない場合はリンクが通ってしまい衝突回避が無効になる。
          # Windows の llvm-nm.exe は出力に \r が混じるため、行末アンカーの検査の前に除去する
          "$llvm_nm" --defined-only --extern-only --format=just-symbols "$lib_path" | tr -d '\r' > target/defined-symbols.txt
          defined_symbols=$(grep -E '^[a-zA-Z_][a-zA-Z0-9_]*$' target/defined-symbols.txt || true)
          if [ -z "$defined_symbols" ]; then
            echo "::error::defined symbols not found in the static library"
            exit 1
          fi
          if echo "$defined_symbols" | grep -v '^shiguredo_vpx_'; then
            echo "::error::symbols without shiguredo_vpx_ prefix found"
            exit 1
          fi
          # 未定義シンボルは MSVC の CRT を参照し、MinGW の CRT を参照していないこと
          "$llvm_nm" --undefined-only --format=just-symbols "$lib_path" | tr -d '\r' > target/undefined-symbols.txt
          mingw_symbols=$(grep -E '^__mingw_|^___chkstk_ms$' target/undefined-symbols.txt || true)
          if [ -n "$mingw_symbols" ]; then
            echo "::error::MinGW CRT symbols found in the MSVC build:"
            echo "$mingw_symbols"
            exit 1
          fi
          msvc_symbols=$(grep -E '^__chkstk$|^__imp___acrt_iob_func$|^__imp__beginthreadex$' target/undefined-symbols.txt || true)
          if [ -z "$msvc_symbols" ]; then
            echo "::error::MSVC CRT symbols not found in the MSVC build"
            exit 1
          fi

  # iOS / Android 向け prebuilt のビルドとリンク検証
  mobile:
    name: Mobile prebuilt
    permissions:
      contents: read
    uses: ./.github/workflows/mobile.yml

  # docs.rs 向けビルド確認
  docs-rs:
    name: docs.rs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCS_RS: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # ツールチェーンは rust-toolchain.toml で MSRV に固定している
      - run: cargo doc --no-deps

  slack_notify:
    needs:
      - fmt-clippy
      - test
      - test-windows
      - mobile
      - docs-rs
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Slack Notification
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
